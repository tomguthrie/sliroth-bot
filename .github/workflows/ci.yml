name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 26
        cache: 'npm'
    - run: npm ci
    - run: npm run typecheck
    - run: npm run lint
    - run: npm run format:check
    - run: npm test
